[project]
name = "driftless-backend"
version = "1.0.0"
description = "Driftless — monocular video in, metric-consistent sparse map out."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.9.0",
    "python-multipart~=0.0.12",
    "numpy~=2.1.0",
    "opencv-python-headless~=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "httpx~=0.27.0",
    "ruff~=0.7.0",
]

[project.scripts]
driftless = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.jobs", "app.routes", "app.runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "BLE", "RUF"]
ignore = [
    "B008",    # FastAPI dependency defaults are declared in the signature by design
    "RUF012",  # mutable class attrs are pydantic fields here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
