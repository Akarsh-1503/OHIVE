[project]
name = "leadforge-backend"
version = "1.0.0"
description = "LeadForge — bulk business-card to structured-lead extraction service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.53.0",
    "pydantic~=2.13.5",
    "python-multipart~=0.0.32",
    "openai~=3.13.0",
    "httpx~=0.28.1",
    "Pillow~=12.3.0",
    "pillow-heif~=1.7.0",
    "pypdfium2~=5.13.0",
    "phonenumbers~=9.0.39",
    "email-validator~=2.3.0",
    "openpyxl~=3.1.5",
    "rapidfuzz~=3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ruff~=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = [
    "B008",    # FastAPI dependency defaults are function calls by design
    "RUF012",  # ClassVar annotations add noise to plain lookup tables
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
