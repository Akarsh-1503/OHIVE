# Top-level stack for the demo host. Lives at /opt/ak-project/docker-compose.yml.
#
# The four application services carry profiles so that `docker compose up -d`
# with COMPOSE_PROFILES unset starts ONLY the reverse proxy. That is what makes
# the box reboot-safe before the first deploy: systemd can bring TLS up without
# wedging on application images that do not exist yet.
#
# Each service lists BOTH its own application profile (`leads` / `slam`) and the
# shared `apps` profile. deploy.sh enables an application's profile once every
# image that application needs has actually been built, so one unfinished
# assignment cannot keep the other one offline. `COMPOSE_PROFILES=apps` still
# means "everything", for anyone driving compose by hand.
#
# IMAGES: the `ak-project/*` images are built by each assignment's own Dockerfile
# / docker-compose.yml under /opt/ak-project/src/<app>. This file only consumes
# them; it never defines how they are built.

name: ak-project

networks:
  ak-project-net:
    name: ak-project-net
    driver: bridge

services:
  # ------------------------------------------------------------------ proxy
  caddy:
    image: caddy:2-alpine
    container_name: ak-project-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Bind mounts rather than named volumes: issued certificates survive a
      # `docker compose down -v` and stay greppable from the host, which matters
      # because Let's Encrypt rate-limits re-issuance.
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - ak-project-net
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # -------------------------------------------------------- Assignment 1: leads
  leads-api:
    image: ak-project/leads-api:latest
    container_name: ak-project-leads-api
    profiles: ["apps", "leads"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      VLM_PROVIDER: ${VLM_PROVIDER:-stub}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      VLM_API_KEY: ${VLM_API_KEY:-}
      MODAL_PROXY_KEY: ${MODAL_PROXY_KEY:-}
      MODAL_PROXY_SECRET: ${MODAL_PROXY_SECRET:-}
      VLM_CONCURRENCY: ${VLM_CONCURRENCY:-6}
      # >=300 is mandatory: the GPU scales to zero and a cold boot has been measured
      # at 205-301 s. 420 leaves margin above the worst observed start. A compose
      # default overrides the application's own default, so this is the value that
      # actually takes effect unless the host .env says otherwise.
      VLM_TIMEOUT_S: ${VLM_TIMEOUT_S:-420}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data/leads:/data
    networks:
      - ak-project-net
    healthcheck:
      # urllib keeps this dependency-free; the image does not need curl or wget.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Mostly waiting on the remote VLM, so it is I/O bound rather than
          # CPU bound; memory covers image decode + downscale buffers.
          cpus: "${LEADS_API_CPUS:-1.00}"
          memory: ${LEADS_API_MEM:-2G}

  leads-web:
    image: ak-project/leads-web:latest
    container_name: ak-project-leads-web
    profiles: ["apps", "leads"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Browser traffic goes back through Caddy on the same origin, so a relative
      # base is correct and keeps the bundle IP-agnostic.
      NEXT_PUBLIC_API_BASE: /api/v1
      # Server components bypass the proxy and talk to the backend directly.
      API_INTERNAL_BASE: http://leads-api:8000/api/v1
    depends_on:
      leads-api:
        condition: service_healthy
    networks:
      - ak-project-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  # -------------------------------------------------------- Assignment 2: slam
  slam-api:
    image: ak-project/slam-api:latest
    container_name: ak-project-slam-api
    profiles: ["apps", "slam"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Default is the stub reconstruction so the public URL is demoable end to end even
      # while the engine is still being finished. Set SLAM_BACKEND=real in .env.local to
      # switch it over; nothing else about the deployment changes.
      SLAM_BACKEND: ${SLAM_BACKEND:-stub}
      SLAM_TARGET_WIDTH: ${SLAM_TARGET_WIDTH:-640}
      SLAM_MAX_FEATURES: ${SLAM_MAX_FEATURES:-1200}
      # 6 of 8 vCPU. Leaves headroom for the proxy and the two Node tiers while
      # still saturating the box during a reconstruction.
      SLAM_WORKERS: ${SLAM_WORKERS:-6}
      SLAM_MAX_POINTS_WEB: ${SLAM_MAX_POINTS_WEB:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data/slam:/data
      # The demo clips are repo content, not runtime state, so they are mounted from the
      # synced source tree read-only rather than baked into the image.
      - ./src/slam/samples:/samples:ro
    networks:
      - ak-project-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Bundle adjustment is the only genuinely CPU-hungry thing on this host, so it
    # gets the lion's share. These are ceilings, not reservations, and the per-service
    # sum deliberately exceeds the host's vCPU count because the web tiers idle.
    #
    # Parameterised because a hardcoded ceiling above the host's core count makes
    # Docker refuse to create the container ("range of CPUs is from 0.01 to 4.00"),
    # which takes the *whole stack* down on a resize -- including TLS. Set
    # SLAM_API_CPUS/SLAM_API_MEM in .env when changing machine type.
    deploy:
      resources:
        limits:
          cpus: "${SLAM_API_CPUS:-3.00}"
          memory: ${SLAM_API_MEM:-10G}
    # Feature matching uses shared memory between worker processes; the 64 MB
    # Docker default is far too small for 1200 features per frame.
    shm_size: 2gb

  slam-web:
    image: ak-project/slam-web:latest
    container_name: ak-project-slam-web
    profiles: ["apps", "slam"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE: /api/v1
      API_INTERNAL_BASE: http://slam-api:8000/api/v1
    depends_on:
      slam-api:
        condition: service_healthy
    networks:
      - ak-project-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
