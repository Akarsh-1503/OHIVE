[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftless-slam"
version = "1.0.0"
description = "Driftless - monocular RGB sparse point-cloud SLAM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy~=2.1",
    "opencv-python-headless~=4.10",
    "scipy~=1.14",
]

[project.optional-dependencies]
# Only the offline vocabulary builder needs scikit-learn; the runtime does not.
vocab = ["scikit-learn~=1.5"]
dev = ["pytest~=8.3", "scikit-learn~=1.5"]

# This directory *is* the package: the backend image runs `pip install /build/slam`,
# so the project root and the importable `slam` package are the same folder.
# Auto-discovery cannot handle that, hence the explicit mapping.
[tool.setuptools]
packages = ["slam"]
include-package-data = true

[tool.setuptools.package-dir]
slam = "."

[tool.setuptools.package-data]
slam = ["*.npz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905"]
